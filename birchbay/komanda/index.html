<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2e5a54">
  <meta name="referrer" content="no-referrer">
  <meta name="station-intake" content="https://script.google.com/macros/s/AKfycbw49U29C0n7UKEf7NtuffVq9CTlBx4p-_o24cw6ZX-XE3QUnwlOiRwOC79J6sU-CXtx/exec">
  <meta name="description" content="Идеи станций фестиваля 13 декабря в 57-й школе.">
  <title>13 декабря · Станции</title>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="style.css?v=c37f09ffa5a0">
  <script src="stations.js?v=bf78aea309c1" defer></script>
  <script src="forms.js?v=e82422394876" defer></script>
</head>
<body>
  <main id="idei">
    <header class="intro">
      <div class="header-row">
        <h1>Примеры станций · <a class="festival-link" href="../" title="Страница фестиваля"><span class="festival-date">13 декабря</span></a></h1>
        <div class="top-controls">
          <button type="button" id="search-toggle" class="icon-button icon-hint" aria-label="Поиск" aria-controls="search-panel" aria-expanded="false">
            <span class="icon-search" aria-hidden="true"></span><span class="icon-tooltip" aria-hidden="true">Поиск</span>
          </button>
          <div id="search-panel" hidden>
            <input type="search" id="query" aria-label="Поиск станций" placeholder="Поиск станций">
          </div>

          <a id="sheet-link" class="icon-button icon-hint" aria-label="Открыть Google-таблицу" target="_blank" rel="noopener noreferrer" hidden>
            <span class="icon-sheet" aria-hidden="true"></span>
            <span class="icon-tooltip" aria-hidden="true">Google-таблица</span>
          </a>
          <details class="header-menu" id="header-menu">
            <summary class="icon-button icon-hint" aria-label="Меню">
              <span class="menu-glyph" aria-hidden="true"></span>
              <span class="icon-tooltip" aria-hidden="true">Меню</span>
            </summary>
            <div class="info-panel">
              <a id="direct" href="https://t.me/d1_d57" target="_blank" rel="noopener noreferrer">Вопросы в Telegram</a>
              <p>Отметьте идеи и нажмите стрелку. Галочка отмечает все станции. Новую идею можно добавить через плюс.</p>
            </div>
          </details>
          <button class="primary icon-button" id="proposal-open" type="button" aria-label="Предложить станцию" title="Предложить станцию" hidden>
            <span class="proposal-plus" aria-hidden="true">+</span>
          </button>
          <div class="pick-actions">
            <label class="master-pick" id="master-pick" title="Выбрать все станции" hidden>
              <input id="select-all" type="checkbox" aria-label="Выбрать все станции">
            </label>
            <output id="selection-count" aria-live="polite" aria-label="Выбрано станций">0</output>
            <button class="primary icon-button icon-hint" type="button" id="selection-submit" aria-label="Открыть отклик" disabled>
              <span aria-hidden="true">→</span><span class="icon-tooltip" aria-hidden="true">Открыть отклик</span>
            </button>
          </div>
        </div>
      </div>
      <p>Программу ещё собираем. Можно отметить одну или несколько идей, предложить свою или пока просто посмотреть</p>
    </header>
    <aside class="controls" aria-label="Фильтры станций">
      <fieldset class="format-group">
        <legend>Форматы</legend>
        <div id="filters" class="chips"></div>
      </fieldset>
      <button type="button" id="toggle-filters" class="quiet" aria-label="Темы" aria-expanded="false" aria-controls="filters-panel">Темы</button>
      <fieldset id="filters-panel" class="topic-group">
        <legend>Темы</legend>
        <div id="topic-filters" class="chips"></div>
      </fieldset>
    </aside>

    <section id="catalog" hidden aria-label="Станции">
      <div class="catalog-result">
        <button type="button" id="reset-catalog" class="quiet" hidden>Сбросить</button>
        <p id="catalog-status" role="status"></p>
      </div>
      <ul id="cards"></ul>
    </section>

    <p id="submission-feedback" role="status" hidden></p>

    <dialog id="station-dialog" aria-labelledby="station-dialog-title">
      <header class="dialog-header">
        <h2 id="station-dialog-title"></h2>
        <button id="station-dialog-pick" class="primary" type="button" aria-pressed="false">
          <span aria-hidden="true" class="pick-symbol">✓</span><span id="station-pick-label">Хочу провести</span>
        </button>
      </header>
      <div id="station-dialog-content"></div>
    </dialog>

    <dialog id="submission" aria-labelledby="submission-title">
      <header class="dialog-header">
        <h2 id="submission-title"></h2>
        <button id="close-submission" class="icon-button dialog-close" type="button" aria-label="Закрыть">×</button>
      </header>
      <form id="submission-form">
        <div id="application-summary" hidden>
          <ul id="application-selection"></ul>
        </div>
        <div id="proposal-fields" hidden>
          <div id="idea-list"></div>
          <button type="button" id="add-idea" class="quiet">+ Ещё станция</button>
        </div>
        <label class="name-field" for="participant">Имя и фамилия
          <input id="participant" placeholder="Иван Петров" maxlength="80" autocomplete="name" required>
        </label>
        <div class="dialog-actions">
          <button type="submit" class="primary" id="idea-submit">Отправить</button>
        </div>
        <p id="idea-status" role="status"></p>
        <button type="button" id="submit-in-google" class="quiet" hidden>Повторить через Google</button>
      </form>
    </dialog>

    <template id="idea-template">
      <fieldset class="idea-draft">
        <legend></legend>
        <button class="quiet remove-idea" type="button" hidden>Убрать</button>
        <label class="idea-action">Что будут делать школьники?
          <textarea name="action" rows="3" maxlength="700"></textarea>
        </label>
        <details class="extra">
          <summary>Детали</summary>
          <label>Название<input name="title" maxlength="90"></label>
          <label>Место в городе<input name="location" maxlength="120"></label>
          <fieldset><legend>Форматы</legend><div data-formats class="chips"></div></fieldset>
          <fieldset><legend>Темы</legend><div data-topics class="chips"></div></fieldset>
          <label>Как устроена станция?<input name="mode" maxlength="240"></label>
          <label>Сколько участников одновременно?<input name="capacity" maxlength="220"></label>
          <label>Что делают ведущие?<input name="team" maxlength="220"></label>
          <label>Что подготовить, распечатать или купить?<input name="materials" maxlength="280"></label>
          <label>Что уточнить до фестиваля?<input name="probe" maxlength="240"></label>
          <label>Задания <small>по одному на строку</small><textarea name="tasks" rows="3" maxlength="700"></textarea></label>
          <label>Как проверить решение?<textarea name="check" rows="2" maxlength="650"></textarea></label>
          <label>Заготовки<textarea name="taskPrep" rows="2" maxlength="650"></textarea></label>
          <label>Источники<textarea name="sources" rows="2" maxlength="650"></textarea></label>
        </details>
      </fieldset>
    </template>
  </main>
</body>
</html>
